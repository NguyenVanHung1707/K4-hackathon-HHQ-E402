services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: vlearn-chromadb
    ports:
      - "8001:8000"
    volumes:
      - ./data/chroma:/chroma/chroma
    restart: unless-stopped
    networks:
      - vlearn-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vlearn-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - CHROMA_SERVER_HOST=chromadb
      - CHROMA_SERVER_PORT=8000
    depends_on:
      - chromadb
    restart: unless-stopped
    networks:
      - vlearn-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: vlearn-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - vlearn-network

networks:
  vlearn-network:
    driver: bridge
